      - name: Confirmar aplicacao segura na base original
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sdceara/tools/aplicar_v04.py sdceara/tools/aplicar_v05.py sdceara/tools/aplicar_no_opl_evolution.py
          python3 sdceara/tools/aplicar_v05.py . --verificar
      - name: Personalizar fonte e imagens apenas nesta execucao
        shell: bash
        run: |
          set -euo pipefail
          python3 sdceara/tools/aplicar_v05.py .
          test -s sdceara-edition-v0.5.json
      - name: Compilar ELF PS2
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make evolution
          test -s OPL-EVOLUTION.ELF
          cp OPL-EVOLUTION.ELF SD-CEARA-GAMES-EVOLUTION-XMB-v0.5-TESTE.ELF
          sha256sum SD-CEARA-GAMES-EVOLUTION-XMB-v0.5-TESTE.ELF > SD-CEARA-GAMES-EVOLUTION-XMB-v0.5-SHA256.txt
      - name: Publicar ELF experimental v0.5
        uses: actions/upload-artifact@v4
        with:
          name: SD-CEARA-GAMES-EVOLUTION-XMB-v0.5-TESTE
          path: |
            SD-CEARA-GAMES-EVOLUTION-XMB-v0.5-TESTE.ELF
            SD-CEARA-GAMES-EVOLUTION-XMB-v0.5-SHA256.txt
            sdceara-edition-v0.5.json
          if-no-files-found: error
          retention-days: 30
