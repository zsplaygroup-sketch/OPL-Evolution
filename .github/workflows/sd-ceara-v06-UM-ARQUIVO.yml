      - name: Verificar alteracoes de interface nativa
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sdceara/tools/aplicar_v04.py sdceara/tools/aplicar_v05.py sdceara/tools/aplicar_v06.py
          python3 sdceara/tools/aplicar_v06.py . --verificar
      - name: Aplicar novo XMB real na copia temporaria
        shell: bash
        run: |
          set -euo pipefail
          python3 sdceara/tools/aplicar_v06.py .
          grep -q "evoXmbDrawDock" src/evo_ui.c
          grep -q "evoXmbSelectTab" src/evo_ui.c
          grep -q "evoXmbDrawHero" src/evo_ui.c
          test -s sdceara-edition-v0.6.json
      - name: Compilar ELF MIPS PS2
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make evolution
          test -s OPL-EVOLUTION.ELF
          cp OPL-EVOLUTION.ELF SD-CEARA-GAMES-EVOLUTION-XMB-v0.6-TESTE.ELF
          sha256sum SD-CEARA-GAMES-EVOLUTION-XMB-v0.6-TESTE.ELF > SD-CEARA-GAMES-EVOLUTION-XMB-v0.6-SHA256.txt
      - name: Publicar ELF experimental com interface real
        uses: actions/upload-artifact@v4
        with:
          name: SD-CEARA-GAMES-EVOLUTION-XMB-v0.6-TESTE
          path: |
            SD-CEARA-GAMES-EVOLUTION-XMB-v0.6-TESTE.ELF
            SD-CEARA-GAMES-EVOLUTION-XMB-v0.6-SHA256.txt
            sdceara-edition-v0.6.json
          if-no-files-found: error
          retention-days: 30
