          from pathlib import Path
          
          # Apply only to the clean tree AFTER v0.7's successful customization.
          def change(path,old,new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f"Patch refused: {path}: expected 1 exact match, got {count} for {old[:60]!r}")
              p.write_text(text.replace(old,new))
          
          change('src/evo_settings.c',
                 '#include "include/pad.h"',
                 '#include "include/pad.h"\n#include "include/sound.h"')
          change('src/evo_settings.c',
                 '    "Background music",',
                 '    "Musica rap (BGM)",')
          change('src/evo_ui.c',
                 '"Sons do menu", "Musica de fundo", "Ordem automatica"',
                 '"Sons do menu", "Batida rap (BGM)", "Ordem automatica"')
          change('src/evo_settings.c',
                 '    return saveConfig(CONFIG_OPL, 0);',
                 '''    /* SD Ceara Games: external OGG audio, not baked into game loader.
               * The native BGM setting keeps ownership of on/off and persistence. */
              if (gDefaultBGMPath[0] == '\\0')
                  snprintf(gDefaultBGMPath, sizeof(gDefaultBGMPath),
                           "mass0:/SDCEARA/bgm.ogg");
          
              /* Let the existing OPL audio engine start/stop the loop immediately
               * after an explicit Save, without altering controller or launch paths. */
              if (gEnableBGM) {
                  if (!isBgmPlaying())
                      bgmStart();
              } else if (isBgmPlaying()) {
                  bgmStop();
              }
          
              return saveConfig(CONFIG_OPL, 0);''')
          
          p=Path('src/sound.c')
          s=p.read_text()
          needle='    bgmFile = fopen(bgmPath, "rb");\n'
          if s.count(needle)!=1: raise SystemExit('sound.c fallback anchor missing')
          s=s.replace(needle, needle + '''#ifdef OPL_EVO_STANDALONE
              /* SD Ceara Games: allow USB port/device aliases; do not modify the
               * selected theme or break a valid user-configured music path. */
              if (bgmFile == NULL) {
                  static const char *const fallbacks[] = {
                      "mass0:/SDCEARA/bgm.ogg",
                      "mass1:/SDCEARA/bgm.ogg",
                      "mass:/SDCEARA/bgm.ogg"
                  };
                  int i;
                  for (i = 0; i < (int)(sizeof(fallbacks) / sizeof(fallbacks[0])); i++) {
                      bgmFile = fopen(fallbacks[i], "rb");
                      if (bgmFile != NULL)
                          break;
                  }
              }
          #endif
          ''')
          p.write_text(s)
          Path('sdceara-edition-v0.8.json').write_text('''{"version":"0.8","base":"v0.7","watermark":true,"original_rap_ogg":"mass0:/SDCEARA/bgm.ogg","music_switch":"EVO_SETTING_BGM","launch_core_unchanged":true}''')
          print('v0.8 music integration applied')
          PY
          test -s gfx/evo_dashboard.png
          test -s SDCEARA/bgm.ogg
          test -s sdceara-edition-v0.8.json

      - name: Seletor musical SD Ceara Games v0.9
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/aplicar_v09.py <<'PY_SDCEARA_V09'
          #!/usr/bin/env python3
          """SD Ceara OPL XMB v0.9 music selector. Apply AFTER v0.8 patch, against clean v0.7 source."""
          from pathlib import Path
          import re

          def change(path: str, old: str, new: str):
              p=Path(path)
              src=p.read_text(encoding='utf-8')
              count=src.count(old)
              if count!=1:
                  raise SystemExit(f'v0.9 patch refused: {path}: match count {count}; expected 1 for {old[:70]!r}')
              p.write_text(src.replace(old,new),encoding='utf-8')

          path='src/evo_settings.c'
          change(path, '#include <stdio.h>','#include <stdio.h>\n#include <string.h>')
          change(path, '    int bgm;\n    int autosort;', '    int bgm;\n    int musicTrack; /* 0 off, 1 original beat, 2 user-supplied song */\n    int autosort;')
          change(path,'    "Musica rap (BGM)",','    "Trilha sonora",')
          change(path,'    settings.bgm = gEnableBGM;', '''    settings.bgm = gEnableBGM;
              /* One tri-state option, so the Settings screen keeps its proven nine rows. */
              settings.musicTrack = !gEnableBGM ? 0 :
                                    (strstr(gDefaultBGMPath, "mesmerize.ogg") != NULL ? 2 : 1);''')
          change(path, '''        case EVO_SETTING_BGM:
                      settings.bgm = evoSettingsToggle(settings.bgm);
                      break;''', '''        case EVO_SETTING_BGM:
                      settings.musicTrack = (settings.musicTrack + (direction < 0 ? 2 : 1)) % 3;
                      settings.bgm = settings.musicTrack != 0;
                      break;''')
          change(path, '''        case EVO_SETTING_BGM:
                      enabled = settings.bgm;
                      break;''', '''        case EVO_SETTING_BGM:
                      snprintf(value, valueSize, "%s",
                               settings.musicTrack == 2 ? "Mesmerize" :
                               settings.musicTrack == 1 ? "Rap SD" : "Off");
                      return;''')

          p=Path(path)
          s=p.read_text(encoding='utf-8')
          regex=r'int evoSettingsSave\(void\)\n\{.*?\n\}\n\nvoid evoSettingsDiscard\(void\)'
          replacement='''int evoSettingsSave(void)
          {
              char selectedPath[sizeof(gDefaultBGMPath)];
              int selectionChanged;

              /* Music remains external to the ELF and OPL game loader. */
              snprintf(selectedPath, sizeof(selectedPath), "mass0:/SDCEARA/%s",
                       settings.musicTrack == 2 ? "mesmerize.ogg" : "bgm.ogg");
              selectionChanged = strcmp(gDefaultBGMPath, selectedPath) != 0;

              /* The existing OPL Vorbis player owns the BGM thread. Stop before switch. */
              if (isBgmPlaying() && (selectionChanged || !settings.bgm))
                  bgmStop();

              gEnableArt = settings.artwork;
              gWideScreen = settings.widescreen;
              gEnableNotifications = settings.notifications;
              gEnableSFX = settings.sfx;
              gEnableBGM = settings.bgm;
              gAutosort = settings.autosort;
              gAutoRefresh = settings.autorefresh;
              gSelectButton = settings.confirmButton;
              gVMode = settings.videoMode;
              snprintf(gDefaultBGMPath, sizeof(gDefaultBGMPath), "%s", selectedPath);

              if (gEnableBGM && !isBgmPlaying())
                  bgmStart();

              return saveConfig(CONFIG_OPL, 0);
          }

          void evoSettingsDiscard(void)'''
          s,n=re.subn(regex,replacement,s,flags=re.S)
          if n != 1:
              raise SystemExit('v0.9 patch refused: expected exactly one SettingsSave function')
          p.write_text(s,encoding='utf-8')

          # Keep the footer and horizontal nav as v0.7. Only change the music caption.
          change('src/evo_ui.c',
                 '"Sons do menu", "Batida rap (BGM)", "Ordem automatica"',
                 '"Sons do menu", "Trilha sonora", "Ordem automatica"')

          path='src/sound.c'
          change(path,'#include <vorbis/vorbisfile.h>', '#include <vorbis/vorbisfile.h>\n#include <string.h>')
          change(path, '''        static const char *const fallbacks[] = {
                      "mass0:/SDCEARA/bgm.ogg",
                      "mass1:/SDCEARA/bgm.ogg",
                      "mass:/SDCEARA/bgm.ogg"
                  };
                  int i;
                  for (i = 0; i < (int)(sizeof(fallbacks) / sizeof(fallbacks[0])); i++) {
                      bgmFile = fopen(fallbacks[i], "rb");
                      if (bgmFile != NULL)
                          break;
                  }''', '''        /* Fall back to another USB alias, never a different requested track. */
                  const char *song = strstr(gDefaultBGMPath, "mesmerize.ogg") != NULL ?
                                    "mesmerize.ogg" : "bgm.ogg";
                  static const char *const devices[] = {"mass0:", "mass1:", "mass:"};
                  char path[256];
                  int i;
                  for (i = 0; i < (int)(sizeof(devices) / sizeof(devices[0])); i++) {
                      snprintf(path, sizeof(path), "%s/SDCEARA/%s", devices[i], song);
                      bgmFile = fopen(path, "rb");
                      if (bgmFile != NULL)
                          break;
                  }''')

          # Explicitly configured track should take precedence over theme BGM in standalone.
          change(path, '''    int themeID = thmGetGuiValue();
              if (themeID != 0) {
                  char *thmPath = thmGetFilePath(themeID);
                  snprintf(bgmPath, sizeof(bgmPath), "%ssound/bgm.ogg", thmPath);
              } else
                  snprintf(bgmPath, sizeof(bgmPath), gDefaultBGMPath);''', '''    int themeID = thmGetGuiValue();
          #ifdef OPL_EVO_STANDALONE
              if (gDefaultBGMPath[0] != '\\0')
                  snprintf(bgmPath, sizeof(bgmPath), "%s", gDefaultBGMPath);
              else if (themeID != 0) {
                  char *thmPath = thmGetFilePath(themeID);
                  snprintf(bgmPath, sizeof(bgmPath), "%ssound/bgm.ogg", thmPath);
              } else
                  bgmPath[0] = '\\0';
          #else
              if (themeID != 0) {
                  char *thmPath = thmGetFilePath(themeID);
                  snprintf(bgmPath, sizeof(bgmPath), "%ssound/bgm.ogg", thmPath);
              } else
                  snprintf(bgmPath, sizeof(bgmPath), gDefaultBGMPath);
          #endif''')

          Path('sdceara-edition-v0.9.json').write_text('''{"version":"0.9","base":"v0.7 + v0.8","watermark":true,"music_option":"Off | Rap SD | Mesmerize","external_tracks":["SDCEARA/bgm.ogg","SDCEARA/mesmerize.ogg"],"launch_core_unchanged":true}''',encoding='utf-8')
          print('v0.9: tri-state music selector applied (game loader and navigation unchanged)')
          PY_SDCEARA_V09
          python3 /tmp/aplicar_v09.py
          test -s sdceara-edition-v0.9.json

      - name: Compilar ELF v0.9 para PlayStation 2
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make evolution
          test -s OPL-EVOLUTION.ELF
          cp OPL-EVOLUTION.ELF SD-CEARA-GAMES-EVOLUTION-XMB-v0.9-TESTE.ELF
          sha256sum SD-CEARA-GAMES-EVOLUTION-XMB-v0.9-TESTE.ELF > SD-CEARA-GAMES-EVOLUTION-XMB-v0.9-SHA256.txt
      - name: Publicar ELF experimental v0.9
        uses: actions/upload-artifact@v4
        with:
          name: SD-CEARA-GAMES-EVOLUTION-XMB-v0.9-TESTE
          path: |
            SD-CEARA-GAMES-EVOLUTION-XMB-v0.9-TESTE.ELF
            SD-CEARA-GAMES-EVOLUTION-XMB-v0.9-SHA256.txt
            sdceara-edition-v0.7.json
            sdceara-edition-v0.8.json
            sdceara-edition-v0.9.json
            SDCEARA/bgm.ogg
          if-no-files-found: error
          retention-days: 30
